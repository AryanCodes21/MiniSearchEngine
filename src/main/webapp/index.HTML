<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wander Search Engine</title>
<meta name="description" content="Wander is a BM25-powered search engine built with Java, Jsoup, and MySQL. Search indexed webpages from our database.">
<!-- No external font requests — system fonts only -->

<style>
  /* ---------- Design tokens ---------- */
  :root {
    --blue:       #3b82f6;
    --blue-dark:  #1d4ed8;
    --blue-glow:  rgba(59, 130, 246, 0.18);
    --ink:        #0f172a;
    --text:       #334155;
    --muted:      #64748b;
    --faint:      #94a3b8;
    --line:       #e2e8f0;
    --field:      #f1f5f9;
    --bg:         #ffffff;
    --card-hover: #f8fafc;
    --font:       "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;

    /* Gradients */
    --grad-hero:  linear-gradient(135deg, #eff6ff 0%, #f0fdf4 50%, #fdf4ff 100%);
    --grad-logo:  linear-gradient(90deg, #3b82f6, #8b5cf6);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* Only one "page" visible at a time */
  .page { display: none; }
  .page.active { display: block; }

  button { font-family: inherit; cursor: pointer; border: none; background: none; }

  :focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; border-radius: 4px; }

  /* ---------- Logo ---------- */
  .logo {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 1.5rem;
    background: var(--grad-logo);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.02em;
  }
  .logo svg { width: 1.1em; height: 1.1em; color: #3b82f6; flex-shrink: 0;
               -webkit-text-fill-color: initial; }

  /* ---------- Pill search bar ---------- */
  .searchbar {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 6px 6px 6px 18px;
    border: 1.5px solid var(--line);
    border-radius: 999px;
    background: var(--bg);
    box-shadow: 0 1px 4px rgba(0,0,0,.06);
    transition: border-color .2s, box-shadow .2s;
  }
  .searchbar > svg { width: 18px; height: 18px; flex: none; color: var(--muted); flex-shrink: 0; }
  .searchbar input {
    flex: 1; min-width: 0;
    border: none; outline: none;
    background: transparent;
    font: inherit; font-size: 1rem; color: var(--ink);
  }
  .searchbar input::placeholder { color: var(--faint); }
  .searchbar:focus-within {
    border-color: var(--blue);
    box-shadow: 0 0 0 4px var(--blue-glow);
  }

  /* ========== PAGE 1: HOMEPAGE ========== */
  #home {
    min-height: 100vh;
    align-items: center;
    justify-content: center;
    background: var(--grad-hero);
    position: relative;
    overflow: hidden;
  }
  #home.active { display: flex; }

  /* decorative blobs */
  #home::before, #home::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: .35;
    pointer-events: none;
  }
  #home::before {
    width: 480px; height: 480px;
    background: #bfdbfe;
    top: -120px; left: -120px;
  }
  #home::after {
    width: 360px; height: 360px;
    background: #ddd6fe;
    bottom: -80px; right: -80px;
  }

  .home-inner {
    position: relative; z-index: 1;
    width: 100%; max-width: 640px;
    padding: 24px;
    text-align: center;
  }
  .home-inner .logo { font-size: 3rem; justify-content: center; margin-bottom: 12px; }
  .tagline {
    color: var(--muted);
    font-size: 1.1rem;
    margin-bottom: 36px;
    letter-spacing: .01em;
  }

  .btn-primary {
    padding: 13px 28px;
    border-radius: 999px;
    background: linear-gradient(135deg, #3b82f6, #6366f1);
    color: #fff;
    font-size: 1rem;
    font-weight: 600;
    box-shadow: 0 4px 14px rgba(99,102,241,.35);
    transition: transform .15s, box-shadow .15s;
  }
  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(99,102,241,.45);
  }
  .btn-primary:active { transform: none; }

  .home-searchbar-wrap { margin-bottom: 20px; }

  .footnote { margin-top: 28px; color: var(--faint); font-size: .85rem; }

  /* badges */
  .home-badges {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-top: 32px;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 5px 12px;
    border-radius: 999px;
    background: rgba(255,255,255,.7);
    border: 1px solid var(--line);
    font-size: .78rem;
    color: var(--muted);
    backdrop-filter: blur(4px);
  }
  .badge svg { width: 12px; height: 12px; }

  /* ========== PAGE 2: RESULTS ========== */
  .results-wrap {
    max-width: 860px;
    margin: 0 auto;
    padding: 24px 24px 72px;
  }

  /* Top row */
  .results-top {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 16px;
  }
  .results-top .logo { font-size: 1.3rem; }
  .results-top form { flex: 1; }

  .icon-btn {
    color: var(--muted);
    display: grid; place-items: center;
    padding: 8px; border-radius: 10px;
    transition: color .15s, background .15s;
    flex-shrink: 0;
  }
  .icon-btn:hover { color: var(--ink); background: var(--field); }
  .icon-btn svg { width: 20px; height: 20px; }

  /* Arrow submit inside results bar */
  .go-btn {
    display: grid; place-items: center;
    padding: 8px 12px;
    border-radius: 999px;
    background: var(--blue);
    color: #fff;
    transition: background .15s;
    flex-shrink: 0;
  }
  .go-btn:hover { background: var(--blue-dark); }
  .go-btn svg { width: 18px; height: 18px; }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 4px;
    margin-top: 18px;
    border-bottom: 1px solid var(--line);
    padding: 0 2px;
  }
  .tab {
    padding: 10px 14px;
    font-size: .9rem;
    font-weight: 500;
    color: var(--muted);
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    border-radius: 6px 6px 0 0;
    transition: color .15s;
  }
  .tab.active { color: var(--blue); border-bottom-color: var(--blue); }
  .tab:not(:disabled):hover { color: var(--ink); background: var(--field); }
  .tab:disabled { cursor: default; opacity: .5; }

  /* Meta line */
  .meta { margin: 22px 0 6px; font-size: .82rem; color: var(--faint); }

  /* Result card */
  .result {
    padding: 18px 16px;
    border-radius: 12px;
    margin-bottom: 4px;
    transition: background .15s;
    border-bottom: 1px solid #f0f0f0;
  }
  .result:last-child { border-bottom: none; }
  .result:hover { background: var(--card-hover); }

  .result .source {
    display: flex; align-items: center; gap: 6px;
    font-size: .8rem; color: var(--muted);
    margin-bottom: 4px;
  }
  .result .source-dot {
    width: 16px; height: 16px; border-radius: 4px;
    background: var(--blue); opacity: .15; flex-shrink: 0;
  }
  .result a {
    display: block;
    font-size: 1.1rem;
    font-weight: 600;
    color: #1a56db;
    text-decoration: none;
    margin-bottom: 5px;
    line-height: 1.35;
  }
  .result a:hover { text-decoration: underline; }
  .result p {
    line-height: 1.6;
    color: var(--text);
    font-size: .92rem;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* Score badge */
  .score-badge {
    display: inline-block;
    margin-top: 6px;
    padding: 2px 8px;
    border-radius: 999px;
    background: #eff6ff;
    color: #3b82f6;
    font-size: .72rem;
    font-weight: 600;
  }

  /* Loading / error / empty states */
  .state-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 64px 24px;
    text-align: center;
    color: var(--muted);
  }
  .state-box svg { width: 48px; height: 48px; opacity: .3; }
  .state-box h2 { font-size: 1.1rem; font-weight: 600; color: var(--text); }
  .state-box p  { font-size: .9rem; max-width: 340px; }

  /* Spinner */
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--line);
    border-top-color: var(--blue);
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }

  /* Pagination */
  .pagination {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 32px;
    justify-content: center;
  }
  .page-btn {
    padding: 8px 16px;
    border-radius: 8px;
    border: 1px solid var(--line);
    font-size: .9rem;
    font-weight: 500;
    color: var(--text);
    background: var(--bg);
    transition: background .15s, border-color .15s;
  }
  .page-btn:hover:not(:disabled) { background: var(--field); border-color: var(--blue); color: var(--blue); }
  .page-btn:disabled { opacity: .4; cursor: default; }
  .page-info { font-size: .85rem; color: var(--muted); padding: 0 8px; }

  @media (max-width: 600px) {
    .results-wrap { padding: 16px 12px 56px; }
    .results-top { gap: 10px; }
    .home-inner .logo { font-size: 2.2rem; }
    .result { padding: 14px 8px; }
  }
</style>
</head>
<body>

<!-- ============ PAGE 1: HOMEPAGE ============ -->
<main id="home" class="page active">
  <div class="home-inner">

    <!-- Logo -->
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3"/>
        <path d="M12 3a9 9 0 1 0 9 9"/>
        <circle cx="19" cy="5" r="1.5"/>
        <circle cx="5" cy="19" r="1.5"/>
      </svg>
      Wander 
    </div>

    <p class="tagline">A smarter way to explore the web.</p>

    <!-- Search form -->
    <form id="home-form" autocomplete="off" class="home-searchbar-wrap">
      <label class="searchbar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
        </svg>
        <input id="home-input" type="search" placeholder="Search news, topics, people..." aria-label="Search">
      </label>
      <button class="btn-primary" type="submit" style="margin-top:16px;">Search</button>
    </form>

    <!-- Feature badges -->
    <div class="home-badges">
      <span class="badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        BM25 Ranking
      </span>
      <span class="badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        Web Index
      </span>
      <span class="badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
        MySQL Backed
      </span>
    </div>

    <p class="footnote">Powered by Java · Jsoup · MySQL</p>
  </div>
</main>


<!-- ============ PAGE 2: SEARCH RESULTS ============ -->
<main id="results" class="page">
  <div class="results-wrap">

    <!-- Top row: logo + search bar -->
    <div class="results-top">
      <button class="logo" id="logo-home" type="button" aria-label="Back to homepage" style="font-size:1.25rem;">
        <svg viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 3a9 9 0 1 0 9 9"/>
          <circle cx="19" cy="5" r="1.5"/>
          <circle cx="5" cy="19" r="1.5"/>
        </svg>
        Wander 
      </button>

      <form id="results-form" autocomplete="off" style="flex:1;">
        <label class="searchbar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
          </svg>
          <input id="results-input" type="search" aria-label="Search">
          <button class="go-btn" type="submit" aria-label="Search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M5 12h14M13 6l6 6-6 6"/>
            </svg>
          </button>
        </label>
      </form>
    </div>

    <!-- Tabs -->
    <div class="tabs" role="tablist">
      <button class="tab active" role="tab" aria-selected="true" id="tab-all">All</button>
      <button class="tab" role="tab" disabled>Images</button>
      <button class="tab" role="tab" disabled>News</button>
      <button class="tab" role="tab" disabled>Videos</button>
    </div>

    <p class="meta" id="results-meta"></p>

    <!-- Results injected here by JS -->
    <section id="result-list" aria-live="polite"></section>

    <!-- Pagination -->
    <div class="pagination" id="pagination" style="display:none;">
      <button class="page-btn" id="prev-btn" type="button">← Previous</button>
      <span class="page-info" id="page-info"></span>
      <button class="page-btn" id="next-btn" type="button">Next →</button>
    </div>
  </div>
</main>


<script>
  /* ============================================================
     Configuration
     Change SEARCH_API_URL to the URL of your deployed servlet.
     During local Tomcat development this is usually:
       http://localhost:8080/WanderSearchEngine/search
     ============================================================ */
     const SEARCH_API_URL = "/WanderSearchEngine/search";


  /* ---------- DOM refs ---------- */
  const homePage     = document.getElementById("home");
  const resultsPage  = document.getElementById("results");
  const homeForm     = document.getElementById("home-form");
  const homeInput    = document.getElementById("home-input");
  const resultsForm  = document.getElementById("results-form");
  const resultsInput = document.getElementById("results-input");
  const resultList   = document.getElementById("result-list");
  const logoHome     = document.getElementById("logo-home");
  const resultsMeta  = document.getElementById("results-meta");
  const pagination   = document.getElementById("pagination");
  const prevBtn      = document.getElementById("prev-btn");
  const nextBtn      = document.getElementById("next-btn");
  const pageInfo     = document.getElementById("page-info");

  /* ---------- State ---------- */
  let currentQuery = "";
  let currentPage  = 1;
  let totalHits    = 0;
  let pageSize     = 10;

  /* ---------- Page switching ---------- */
  function showPage(page) {
    homePage.classList.toggle("active", page === "home");
    resultsPage.classList.toggle("active", page === "results");
  }

  /* ---------- Render helpers ---------- */
  function showLoading() {
    resultList.innerHTML = "";
    resultList.appendChild(makeStateBox("spinner", "", ""));
    resultsMeta.textContent = "";
    pagination.style.display = "none";
  }

  function makeStateBox(type, heading, body) {
    const box = document.createElement("div");
    box.className = "state-box";
    if (type === "spinner") {
      box.innerHTML = '<div class="spinner"></div><p>Searching…</p>';
    } else if (type === "empty") {
      box.innerHTML = `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
        </svg>
        <h2>${escHtml(heading)}</h2>
        <p>${escHtml(body)}</p>`;
    } else if (type === "error") {
      box.innerHTML = `
        <svg viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="1.5">
          <circle cx="12" cy="12" r="10"/><path d="M12 8v4m0 4h.01"/>
        </svg>
        <h2>${escHtml(heading)}</h2>
        <p>${escHtml(body)}</p>`;
    }
    return box;
  }

  function renderResults(data) {
    resultList.replaceChildren();

    const { query, results, totalHits: total, page, pageSize: ps } = data;
    totalHits = total;
    pageSize  = ps;

    const totalPages = Math.ceil(total / ps);

    // Meta line
    if (total === 0) {
      resultsMeta.textContent = `No results for "${query}"`;
      resultList.appendChild(makeStateBox("empty",
        `No results for "${query}"`,
        "Try different keywords or check your database has been crawled and indexed."));
      pagination.style.display = "none";
      return;
    }

    resultsMeta.textContent =
      `About ${total.toLocaleString()} result${total === 1 ? "" : "s"} · BM25 ranked`;

    // Result cards
    results.forEach(item => {
      const card = document.createElement("article");
      card.className = "result";

      // source line
      const src = document.createElement("div");
      src.className = "source";
      const dot = document.createElement("span");
      dot.className = "source-dot";
      const srcText = document.createTextNode(
        (item.source || item.domain || "Unknown") + " · " + (item.domain || "")
      );
      src.append(dot, srcText);

      // title link
      const link = document.createElement("a");
      link.href = item.url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = item.title || item.url;

      // snippet
      const snippet = document.createElement("p");
      snippet.textContent = item.snippet || "";

      // BM25 score badge
      const score = document.createElement("span");
      score.className = "score-badge";
      score.textContent = "BM25 " + parseFloat(item.score).toFixed(2);

      card.append(src, link, snippet, score);
      resultList.append(card);
    });

    // Pagination
    if (totalPages <= 1) {
      pagination.style.display = "none";
    } else {
      pagination.style.display = "flex";
      prevBtn.disabled = page <= 1;
      nextBtn.disabled = page >= totalPages;
      pageInfo.textContent = `Page ${page} of ${totalPages}`;
    }
  }

  /* ---------- Fetch from backend ---------- */
  async function runSearch(query, page) {
    const q = query.trim();
    if (!q) return;

    currentQuery = q;
    currentPage  = page;

    resultsInput.value = q;
    showPage("results");
    showLoading();
    window.scrollTo(0, 0);

    try {
      const url = new URL(SEARCH_API_URL);
      url.searchParams.set("q", q);
      url.searchParams.set("page", page);

      const resp = await fetch(url.toString());
      if (!resp.ok) throw new Error("Server returned HTTP " + resp.status);

      const data = await resp.json();
      if (data.error) throw new Error(data.error);

      renderResults(data);

    } catch (err) {
      resultsMeta.textContent = "";
      resultList.replaceChildren(makeStateBox("error",
        "Something went wrong",
        "Could not reach the search backend. Make sure Tomcat is running at " +
        SEARCH_API_URL + " — " + err.message
      ));
      pagination.style.display = "none";
    }
  }

  /* ---------- Escape helper (prevent XSS from error messages) ---------- */
  function escHtml(s) {
    return (s || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  /* ---------- Event wiring ---------- */
  homeForm.addEventListener("submit", e => {
    e.preventDefault();
    runSearch(homeInput.value, 1);
  });

  resultsForm.addEventListener("submit", e => {
    e.preventDefault();
    runSearch(resultsInput.value, 1);
  });

  logoHome.addEventListener("click", () => {
    homeInput.value = "";
    showPage("home");
    homeInput.focus();
  });

  prevBtn.addEventListener("click", () => {
    if (currentPage > 1) runSearch(currentQuery, currentPage - 1);
  });

  nextBtn.addEventListener("click", () => {
    const totalPages = Math.ceil(totalHits / pageSize);
    if (currentPage < totalPages) runSearch(currentQuery, currentPage + 1);
  });

  // Keyboard shortcut: "/" focuses search
  document.addEventListener("keydown", e => {
    if (e.key === "/" && document.activeElement.tagName !== "INPUT") {
      e.preventDefault();
      if (homePage.classList.contains("active")) homeInput.focus();
      else resultsInput.focus();
    }
  });
</script>

</body>
</html>
